  <script>
  // 카카오톡 공유 링크 호환용 경유 페이지 — 지우지 말 것.
  //
  // 카카오는 앱에 등록되지 않은 도메인의 링크를 '등록된 도메인'으로 통째로 바꿔서 보낸다.
  // 카카오 앱에 등록된 도메인이 https://wlfmzhs.github.io 라서,
  // https://www.ggzon.co.kr/used-market-detail.html 로 공유해도 카톡방에서는
  // https://wlfmzhs.github.io/used-market-detail.html 로 열려 404가 났다.
  //
  // 그래서 공유 링크에 /ggzon 경로를 붙여 어느 도메인으로 바뀌어도 살아남게 했다:
  //   wlfmzhs.github.io/ggzon/used-market-detail.html -> 301 -> www.ggzon.co.kr/used-market-detail.html (정상)
  //   www.ggzon.co.kr/ggzon/used-market-detail.html   -> 이 파일 -> /used-market-detail.html            (정상)
  location.replace('/used-market-detail.html' + location.search + location.hash);
  </script>
