<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진해신항CC 파 수정</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; max-width: 520px; margin: 0 auto; }
    h2 { color: #3ea066; margin-bottom: 6px; }
    .sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 20px; line-height: 1.6; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 8px; }
    th, td { border: 1px solid rgba(255,255,255,0.12); padding: 5px 2px; text-align: center; }
    th { color: rgba(255,255,255,0.5); font-weight: 600; }
    td.label { text-align: left; padding-left: 8px; color: rgba(255,255,255,0.7); white-space: nowrap; }
    .chg { background: rgba(62,160,102,0.25); color: #6fe0a0; font-weight: 700; }
    .cap { font-size: 12px; color: rgba(255,255,255,0.35); margin: 14px 0 4px; }
    button { width: 100%; padding: 14px; border-radius: 12px; background: #3ea066; color: #fff; border: none; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 16px; }
    button:disabled { background: #555; cursor: default; }
    #log { margin-top: 16px; font-size: 13px; line-height: 1.8; color: #aaa; }
    .ok  { color: #3ea066; }
    .err { color: #e74c3c; }
  </style>
</head>
<body>
  <h2>진해신항CC 파 수정</h2>
  <div class="sub">
    아웃 / 인 코스의 홀 파 정보가 서로 뒤바뀌어 등록돼 있어 바로잡습니다.<br>
    3번홀·4번홀 파가 서로 맞바뀝니다. (courses/진해신항CC · nineHoles)
  </div>

  <div class="cap">현재 (잘못된 값)</div>
  <table id="tbl-before"></table>
  <div class="cap">수정 후</div>
  <table id="tbl-after"></table>

  <button id="btn-fix" onclick="runFix()">Firestore에 적용</button>
  <div id="log"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyC-31zadgV4hkQm7fFqbDrxtJRAIeo6k18",
  authDomain: "ggzon-b33cb.firebaseapp.com",
  projectId: "ggzon-b33cb",
  storageBucket: "ggzon-b33cb.firebasestorage.app",
  messagingSenderId: "774722580869",
  appId: "1:774722580869:web:5beecd26c0b76f753914ec"
});
const db = getFirestore(app);

const COURSE = '진해신항CC';

// 2026-08-12 등록 당시 값 (아웃/인이 뒤바뀐 상태)
const BEFORE = {
  '진해 OUT': [4,4,5,3,4,4,4,3,5],
  '진해 IN':  [4,4,3,5,4,4,4,3,5],
  '신항 OUT': [4,4,5,3,4,4,4,3,5],
  '신항 IN':  [4,4,3,5,4,4,4,3,5],
};
// 아웃 <-> 인 스왑
const AFTER = {
  '진해 OUT': [4,4,3,5,4,4,4,3,5],
  '진해 IN':  [4,4,5,3,4,4,4,3,5],
  '신항 OUT': [4,4,3,5,4,4,4,3,5],
  '신항 IN':  [4,4,5,3,4,4,4,3,5],
};

function renderTable(el, data, diffWith) {
  let html = '<tr><th></th>' + Array.from({length:9}, (_,i) => `<th>${i+1}</th>`).join('') + '<th>계</th></tr>';
  for (const [nine, pars] of Object.entries(data)) {
    const cells = pars.map((p, i) => {
      const changed = diffWith && diffWith[nine] && diffWith[nine][i] !== p;
      return `<td class="${changed ? 'chg' : ''}">${p}</td>`;
    }).join('');
    html += `<tr><td class="label">${nine}</td>${cells}<td>${pars.reduce((a,b)=>a+b,0)}</td></tr>`;
  }
  el.innerHTML = html;
}
renderTable(document.getElementById('tbl-before'), BEFORE, null);
renderTable(document.getElementById('tbl-after'), AFTER, BEFORE);

function log(msg, cls) {
  document.getElementById('log').innerHTML += `<div class="${cls || ''}">${msg}</div>`;
}

window.runFix = async function() {
  const btn = document.getElementById('btn-fix');
  btn.disabled = true;
  btn.textContent = '적용 중...';
  try {
    const snap = await getDoc(doc(db, 'courses', COURSE));
    const cur  = snap.exists() ? (snap.data().nineHoles || {}) : {};
    log('현재 등록된 9홀: ' + (Object.keys(cur).join(', ') || '(없음)'));

    // 기존에 없던 코스명은 건드리지 않고, 4개 나인만 덮어쓴다 (merge)
    await setDoc(doc(db, 'courses', COURSE), { name: COURSE, nineHoles: AFTER }, { merge: true });

    const after = (await getDoc(doc(db, 'courses', COURSE))).data().nineHoles || {};
    let allOk = true;
    for (const [nine, pars] of Object.entries(AFTER)) {
      const got = after[nine] || [];
      const ok  = JSON.stringify(got) === JSON.stringify(pars);
      if (!ok) allOk = false;
      log(`${ok ? '✓' : '✗'} ${nine} → [${got.join(', ')}]`, ok ? 'ok' : 'err');
    }
    btn.textContent = allOk ? '적용 완료' : '적용됨 (검증 실패)';
    log(allOk ? '--- 수정 완료 ---' : '--- 값이 예상과 다릅니다 ---', allOk ? 'ok' : 'err');
  } catch(e) {
    log('실패: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '다시 시도';
  }
};
</script>
</body>
</html>
